# Rules for the "suggested flag" column. These only suggest; a person decides.
[flags]
# a resident looking up an address, not a buyer
address = ['\b2013\d\d\b', '\b1220\d\d\b', '\b[a-z]{1,2} ?\d{1,4} sector\b', '\bsector \d+[a-z]? [a-z] block\b', '\b[a-h] block\b', '\b(gh|plot|flat|house) ?no\b', '\bnear me\b']
budget = ['\blakh', '\blakhs\b', '\bunder (?:1|2|one|two) ?(?:cr|crore)\b', '\baffordable\b', '\bcheap\b', '\blow price\b', '\bbudget\b', '\b1 ?bhk\b', '\b2 ?bhk\b']
rent_or_stay = ['\brent\b', '\brental\b', '\bpg\b', '\b1 ?rk\b', '\bstudio\b', '\bservice[d]? apartment', '\bfurnished\b', '\bsharing\b', '\bairbnb\b', '\bstay[sz]?\b', '\bhostel\b', '\blease\b']
jobs_or_other = ['\bjobs?\b', '\bvacanc', '\bsalary\b', '\bplot\b', '\bland\b', '\bscheme\b', '\bauthority\b', '\bshop\b', '\boffice\b', '\bcommercial\b']

# Single words that are risky as a campaign-wide broad negative (they block many good searches).
risky_negative_words = ["home", "homes", "house", "flat", "flats", "apartment", "apartments", "project", "projects",
  "new", "greater", "noida", "gurgaon", "gurugram", "villa", "villas", "society", "societies", "luxury", "price",
  "sale", "buy", "best", "launch", "sector", "city", "ready", "bhk", "property", "estate", "real", "tower", "floor",
  "road", "park", "green", "delhi", "west", "east", "developers", "village", "residency", "homes"]

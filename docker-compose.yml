# County Search QC, shared privately with Tailscale (docs/REMOTE_ACCESS.md).
#   deploy/setup.ps1 (Windows) or sh deploy/setup.sh (Linux) once, then: docker compose up -d --build
# No port is opened on the machine or the internet: the dashboard listens on 127.0.0.1 inside the Tailscale container's
# network, and only devices signed in to your tailnet (you and the people you invite) can open https://county-qc.<tailnet>.ts.net
services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    hostname: county-qc
    environment:
      TS_AUTHKEY: file:/run/secrets/ts_authkey
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ts-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    secrets: [ts_authkey]
    restart: unless-stopped

  qc:
    build: .
    network_mode: service:tailscale
    depends_on: [tailscale]
    environment:
      QC_REPO: abhay-tech1651/str-qc
      QC_SYNC_MINUTES: "10"
      QC_READ_ONLY: "1"
      # the private name Tailscale gives this copy; deploy/setup writes your tailnet name to .env (QC_TAILNET=...)
      QC_ALLOWED_HOSTS: county-qc.${QC_TAILNET:?run deploy/setup.ps1 or deploy/setup.sh first}.ts.net
      QC_TOKEN_FILE: /run/secrets/github_token
      QC_PASSPHRASE_FILE: /run/secrets/qc_passphrase
    secrets: [github_token, qc_passphrase]
    read_only: true
    tmpfs: [/tmp, "/app/dashboard/.next/cache:uid=1000,gid=1000"]
    volumes:
      - qc-data:/app/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

secrets:
  ts_authkey:
    file: ./deploy/secrets/ts_authkey
  github_token:
    file: ./deploy/secrets/github_token
  qc_passphrase:
    file: ./deploy/secrets/qc_passphrase

volumes:
  ts-state:
  qc-data:
